# platform-api is the only workload in this system with any Kubernetes API
# access — two namespaced Roles, never a ClusterRole: pod listing (below),
# plus a narrowly-scoped Deployment-restart grant (see the second Role
# further down) added for the admin System Health page's Restart button.
# No Node-listing permission is needed since each Pod object already
# carries its own scheduled node in spec.nodeName.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api-pod-reader
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api-pod-reader
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: platform-api-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# A second, separately-named Role — deliberately not folded into the
# pod-reader Role above, so each grant stays self-documenting and this one
# remains easy to audit or revoke on its own. `resourceNames` restricts the
# patch verb to exactly these seven Deployments (the six backends + the
# frontend) — the ServiceAccount cannot touch `postgres`/`rabbitmq` or any
# future Deployment even if application code had a bug, since RBAC itself
# blocks it before the request reaches platform-api's own name-allowlist
# check. Still a namespaced Role, never a ClusterRole. See notes.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api-deployment-restarter
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
    resourceNames:
      - users-api
      - catalog-api
      - orders-api
      - payments-api
      - notifications-api
      - platform-api
      - frontend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api-deployment-restarter
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: platform-api-deployment-restarter
  apiGroup: rbac.authorization.k8s.io
