services:
  platform-api:
    build:
      context: .
      dockerfile: src/FiapGames.Platform.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set}
      Jwt__Issuer: FiapGames
      Jwt__Audience: FiapGames.Client
      Jwt__ExpiryMinutes: "60"
